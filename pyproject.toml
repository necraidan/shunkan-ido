[project]
name = "shunkan-ido"
version = "0.1.0"
description = "Effets de webcam pour Zoom au geste : téléportation (Shunkan Idō) et guerrier doré (Golden Warrior)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "pyvirtualcam>=0.11",
]

[project.scripts]
shunkan-ido = "shunkan_ido.main:main"
golden-warrior = "golden_warrior.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["camkit", "shunkan_ido", "golden_warrior"]
